name: 毎朝の商品データ更新

on:
  schedule:
    - cron: "0 22 * * *"    # 毎朝 7:00（日本時間）。ダイソー 5:00・イケア 5:30・ザラ 6:00・エンダー 6:30 とずらす
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 商品データを取り直す
        run: python3 -u scripts/build.py
      - name: 変わっていればコミット（Vercel が自動で公開し直す）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "商品データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git pull --rebase
            git push
          fi
